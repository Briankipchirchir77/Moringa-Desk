# One-click deploy config for Render.com (a free-friendly host).
# It creates a PostgreSQL database and a web service wired together.
services:
  - type: web
    name: moringadesk-api
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn 'run:app'"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: moringadesk-db
          property: connectionString

databases:
  - name: moringadesk-db
    plan: free
